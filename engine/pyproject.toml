[project]
name = "solidifai-engine"
version = "0.7.0"
description = "App-owned build123d service: single source of truth for the solidifai 3D CAD app."
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "build123d>=0.10",
    "dulwich>=1.2.6",
    "fpdf2>=2.7",
    "mcp",
    "pillow",
    # Imported directly (views.py renders through vtkmodules); do not rely on
    # cadquery-ocp's metadata to pull it in, newer releases dropped the pin.
    "vtk>=9.3",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["solidifai", "solidifai_engine", "solidifai_mcp"]

# fpdf2 is LGPL-3.0-only (the drawing PDF backend); LGPLv3 sec. 4 wants a
# prominent notice plus the GPL text it incorporates, shipped with the bundle.
[tool.hatch.build.targets.wheel.force-include]
"THIRD-PARTY-NOTICES.md" = "solidifai_engine/THIRD-PARTY-NOTICES.md"
"licenses/GPL-3.0-only.txt" = "solidifai_engine/licenses/GPL-3.0-only.txt"
"licenses/LGPL-3.0-only.txt" = "solidifai_engine/licenses/LGPL-3.0-only.txt"

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest",
    "ruff>=0.15.16",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".venv",
    "workspace_templates",
    "build",
    "dist",
    "*.egg-info",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Tests reach into internals and reuse fixtures; allow unused imports/loop binds.
# E402: tests group imports beside the section that uses them, after earlier code.
"tests/**" = ["F401", "B007", "E402"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true  # build123d/OCP/VTK/lib3mf ship no stubs
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
warn_redundant_casts = true
