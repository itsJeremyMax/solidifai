[package]
name = "engine-pack"
version = "0.1.0"
edition = "2021"
description = "Content-addressed engine manifest/pack format for solidifai updates"
license = "Apache-2.0"

[lib]
name = "engine_pack"
path = "src/lib.rs"

[[bin]]
name = "engine-pack"
path = "src/bin/engine-pack.rs"

[dependencies]
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zstd = "0.13"
tar = "0.4"
walkdir = "2"
minisign-verify = "0.2"
anyhow = "1"

[dev-dependencies]
tempfile = "3"
